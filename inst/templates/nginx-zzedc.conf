# Reverse proxy for a ZZedc study: terminates HTTPS and forwards to the
# Shiny application listening only on the loopback address.
#
# Start the application with launch_zzedc(host = "127.0.0.1", port = 3838)
# so it is not reachable except through this proxy. ZZedc trusts the
# X-Forwarded-Proto header only from 127.0.0.1 (see
# ?zzedc::session_https_status).
#
# Replace study.example.edu and the certificate paths.

server {
    listen 80;
    server_name study.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name study.example.edu;

    ssl_certificate     /etc/ssl/certs/study.example.edu.crt;
    ssl_certificate_key /etc/ssl/private/study.example.edu.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HTTP Strict Transport Security: browsers use HTTPS for this host
    # for a year after the first visit.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:3838;
        proxy_http_version 1.1;
        # Shiny uses WebSockets.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1d;
    }
}
